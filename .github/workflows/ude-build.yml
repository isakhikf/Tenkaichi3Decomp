# Defense assist (UDE) integration build: the host tests of the engine, then the official release build (the same
# container as release.yml: Ubuntu 22.04, clang/LLVM 22, SDL3 from source, mingw-w64) for Linux and Windows x64.
# Runs only for branches named ude-* and by hand; it never runs for main and never publishes a release.
name: ude-build

on:
  push:
    branches: ["ude-**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ude-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: UDE-DB1 generated data, native bodies, policy and adapter tests
        run: |
          python3 tools/defense_db/build.py
          python3 tools/defense_db/build.py --check
          python3 port/tests/ude_db/run_tests.py
      - name: UDE host tests (unit, logic simulation, property campaigns, database-driven)
        run: |
          set -e
          cd port/tests/ude
          gcc -std=c99 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -I../../src ../../src/ude.c ../../src/ude_recipe.c test_ude.c -o test_ude
          gcc -std=c99 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -I../../src ../../src/ude.c ../../src/ude_recipe.c test_ude_v2.c -o test_ude_v2
          gcc -std=c99 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -I../../src ../../src/ude.c ../../src/ude_recipe.c ../../src/ude_telemetry.c test_telemetry.c -o test_telemetry
          gcc -std=c99 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -I../../src ../../src/ude.c ../../src/ude_recipe.c test_ude_v4.c -o test_ude_v4
          gcc -std=c99 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -I../../src ../../src/ude.c ../../src/ude_recipe.c replay_log.c -o replay_log
          ./test_ude 3000 > results_v1.csv
          ./test_ude_v2 data/edge_cover.txt data/db_states.txt > results_v2.csv
          mkdir -p tel && ./test_telemetry tel 2 | tee results_telemetry.txt
          grep -q "dropped=0" results_telemetry.txt
          test "$(($(wc -l < tel/ude_log.csv) - 1))" = "$(sed -n 's/.*frame_lines=\([0-9]*\).*/\1/p' results_telemetry.txt)"
          ./test_ude_v4 > results_v4.csv
          # Hybrid v5: the Codex R8 recipes (unit + logic simulation), the v5 telemetry, the snapshot field lists
          gcc -std=c99 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -I../../src ../../src/ude.c ../../src/ude_recipe.c test_ude_v5.c -o test_ude_v5
          gcc -std=c99 -O2 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -I../../src ../../src/ude.c ../../src/ude_recipe.c ../../src/ude_telemetry.c test_telemetry_v5.c -o test_telemetry_v5
          ./test_ude_v5 > results_v5.csv
          mkdir -p tel5 && ./test_telemetry_v5 tel5 > results_v5_telemetry.csv
          (cd ../../.. && python3 port/tests/ude/check_recipe_ids.py) | tee results_v5_ids.txt
          grep -q "problems=0" results_v5_ids.txt
          ./replay_log data/real_c5_ude_log.csv fidelity | tee results_real_replay.txt
          # real log (cycle 5): the engine must reproduce every injected / not-injected decision the game logged
          awk '{for(i=1;i<=NF;i++){split($i,a,"=");v[a[1]]=a[2]}} END{exit !(v["compared"]>0 && v["same_injected"]==v["compared"])}' results_real_replay.txt
          grep -c ",PASS," results_v1.csv results_v2.csv results_v4.csv results_v5.csv results_v5_telemetry.csv
          if grep ",FAIL," results_v1.csv results_v2.csv results_v4.csv results_v5.csv results_v5_telemetry.csv; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ude-test-results
          path: |
            port/tests/ude/results_*
            port/tests/ude_db/results/*.txt
            port/tests/ude_db/results/*.json

  build:
    needs: engine-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: port/release
          tags: bt3-port-release:jammy
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build both archives (official inside.sh, no build key, version "dev")
        run: |
          mkdir -p port/build
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src \
            bt3-port-release:jammy sh port/release/inside.sh 2>&1 | tee port/build/ude_build_log.txt
      - name: Candidate settings and offline DB1 guide
        run: python3 tools/defense_db/package.py
      - name: Verify the build (link, package contents, defense assist symbols, hashes)
        run: |
          set -e
          cd port/build
          if grep -i -E "undefined reference|unresolved external|^FAILED" compile_win64.txt link_win64.txt; then
            echo "the Windows compile / link log reports errors"; exit 1
          fi
          unzip -l Tenkaichi3Decomp-windows-x64.zip | tee zip_contents.txt
          for f in Tenkaichi3Decomp/Tenkaichi3Decomp.exe Tenkaichi3Decomp/Tenkaichi3Decomp-setup.exe Tenkaichi3Decomp/SDL3.dll; do
            grep -q " $f$" zip_contents.txt || { echo "missing in the zip: $f"; exit 1; }
          done
          docker run --rm -v "$PWD":/b -w /b bt3-port-release:jammy sh -c \
            'x86_64-w64-mingw32-nm bt3.exe 2>/dev/null | grep -E " T (PortUdeDb_Filter|UdeDb_Choose|UdeDb_Step|BtlHit_PortUdeDbQuery|PortUde_Filter|BtlHit_PortUdeQuery|BtlHit_PortUdeRecipe|BtlCharApi_PortBlastEta10|UdeTel_Frame|Ude_Step|UdeRecipe_Step)" || strings bt3.exe | grep -m1 "UDE-DB1"' \
            | tee ude_symbols.txt
          test -s ude_symbols.txt
          for symbol in PortUdeDb_Filter UdeDb_Choose UdeDb_Step BtlHit_PortUdeDbQuery; do
            grep -q "$symbol" ude_symbols.txt || { echo "missing DB1 symbol: $symbol"; exit 1; }
          done
          { echo "commit $GITHUB_SHA"; echo "run $GITHUB_RUN_ID"; sha256sum Tenkaichi3Decomp-windows-x64.zip Tenkaichi3Decomp-linux-x64.zip bt3.exe; } | tee ude_artifact_hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ude-build-logs
          path: |
            port/build/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Tenkaichi3Decomp-windows-x64-ude
          path: port/build/Tenkaichi3Decomp-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Tenkaichi3Decomp-linux-x64-ude
          path: port/build/Tenkaichi3Decomp-linux-x64.zip
          if-no-files-found: error
